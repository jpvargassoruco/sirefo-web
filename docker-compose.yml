services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      SIREFO_DB_URL: sqlite:////data/sirefo.db
    volumes:
      - sirefo_data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sirefo_data:
